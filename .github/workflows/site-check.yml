name: Site checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check generated pages are committed
        run: |
          python3 scripts/build-pages.py
          git diff --exit-code -- '*.html'
      - name: Build and test the publishable website
        run: npm run check
